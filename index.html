<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e7c66">
<title>Pathan Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;600&display=swap">
<style>
/* Pathan Messenger v5 (5 Nov 2026): one question at a time, one big button.
   Voice is always recorded and saved (works on iPhone and Android). Android also writes the words live.
   Talks to the Apps Script web app through its JSON door (doPost). */
:root{
  --bg:#f3f5f4; --surface:#fff; --surface-2:#e8edea; --text:#101614; --text-2:#4c5853; --text-3:#7d8984;
  --accent:#0e7c66; --accent-2:#13a083; --accent-soft:#dcefe9; --ink:#fff;
  --rec:#d93a40; --ok:#1f9d55; --warn:#a35f00; --warn-soft:#fdf0dc;
  --shadow:0 1px 2px rgba(16,22,20,.06),0 8px 24px rgba(16,22,20,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f0e; --surface:#151b19; --surface-2:#202825; --text:#eef3f1; --text-2:#a8b4af; --text-3:#727f7a;
  --accent:#27b391; --accent-2:#3fd0ab; --accent-soft:#12302a; --ink:#04120e; --rec:#ff5d63; --warn:#f0b25a; --warn-soft:#2c2414;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:20px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:540px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.i{width:26px;height:26px;flex:none}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,var(--accent-2),var(--accent) 70%)}
.avatar span{font-family:var(--urdu);font-size:25px;line-height:1;transform:translateY(-5px)}
.hello{flex:1;min-width:0}
.hello small{display:block;font-size:15px;color:var(--text-2)}
.hello b{display:block;font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{height:46px;padding:0 14px;border-radius:23px;background:var(--surface);box-shadow:var(--shadow);font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}

.banner{margin:0 0 12px;padding:12px 14px;border-radius:16px;font-size:17px;font-weight:600;text-align:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.learned{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);font-size:17px}
.learned small{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.count{font-size:16px;color:var(--text-3);font-weight:600}
.q-urdu{font-family:var(--urdu);direction:rtl;text-align:right;font-size:28px;line-height:2.1;margin:0}
.q-roman{margin:0;font-size:23px;font-weight:650;line-height:1.35}
.q-en{margin:0;font-size:15px;color:var(--text-3)}
.listen{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface-2);font-size:17px;font-weight:600;color:var(--text-2)}

.said{display:flex;flex-direction:column;gap:6px}
.said:empty{display:none}
.b{align-self:flex-end;max-width:88%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--ink);font-size:18px;white-space:pre-wrap;word-wrap:break-word}
.b.bot{align-self:flex-start;border-radius:20px 20px 20px 6px;background:var(--surface-2);color:var(--text)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:58px;padding:12px 18px;border-radius:18px;background:var(--surface);border:2px solid var(--accent-soft);font-size:19px;font-weight:650;text-align:left}
.opt:active{background:var(--accent-soft)}
.opt.muted{border-color:var(--surface-2);color:var(--text-2);font-weight:600}
.hint{margin:2px 0 -4px;font-size:16px;color:var(--text-3)}
.mic{width:100%;min-height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:23px;font-weight:750;color:#fff;
  background:radial-gradient(120% 140% at 20% 0%,var(--accent-2),var(--accent) 60%);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent)}
.mic:active{transform:scale(.985)}
.mic .ring{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.mic .ring .i{width:28px;height:28px}
.soft{width:100%;min-height:58px;border-radius:18px;background:var(--surface-2);font-size:19px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px}
.typebox{display:flex;flex-direction:column;gap:10px}
.typebox textarea{width:100%;min-height:110px;border:0;border-radius:18px;background:var(--surface-2);color:var(--text);font:inherit;font-size:20px;padding:14px;resize:vertical}
.primary{width:100%;min-height:62px;border-radius:18px;background:var(--accent);color:var(--ink);font-size:20px;font-weight:750}
.skip{align-self:center;padding:12px 18px;font-size:17px;color:var(--text-2)}

/* full-screen states */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px))}
.screen h2{margin:0;font-size:30px;line-height:1.2}
.screen p{margin:0;font-size:19px;color:var(--text-2);max-width:30ch}
.screen .primary,.screen .soft{max-width:380px}
.rec-dot{width:18px;height:18px;border-radius:50%;background:var(--rec);animation:pulse 1.2s infinite;display:inline-block;vertical-align:middle;margin-right:8px}
.timer{font-size:64px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
#wave{width:100%;max-width:380px;height:90px}
.live{width:100%;max-width:380px;min-height:0;max-height:130px;overflow:auto;padding:10px 14px;border-radius:16px;background:var(--surface);font-family:var(--urdu);direction:rtl;text-align:right;font-size:19px;line-height:1.9}
.stop{width:100%;max-width:380px;min-height:84px;border-radius:24px;background:var(--rec);color:#fff;font-size:25px;font-weight:800;box-shadow:0 10px 24px color-mix(in srgb,var(--rec) 35%,transparent)}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--surface-2);border-top-color:var(--accent);animation:spin 1s linear infinite}
.check svg{width:110px;height:110px}
.check circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.check path{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:0;animation:draw .6s .1s ease-out both}
.x svg{width:96px;height:96px}
.quote{max-width:380px;padding:12px 16px;border-radius:16px;background:var(--surface);font-size:18px;color:var(--text);white-space:pre-wrap}

.sheet{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:26px}
.photo{min-height:62px;border-radius:18px;border:2px dashed var(--text-3);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--accent);font-size:19px}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:18px}
input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,160%);opacity:0;pointer-events:none;transition:transform .3s,opacity .2s;
  background:var(--text);color:var(--bg);padding:14px 20px;border-radius:18px;font-size:17px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px}
@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.check path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" aria-hidden="true"><span>پ</span></div>
    <div class="hello"><small id="greet">Assalam o alaikum</small><b id="name">&nbsp;</b></div>
    <button class="more" id="moreBtn" type="button" hidden>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo
    </button>
  </header>
  <div class="banner warn" id="offline" hidden>Internet nahi hai. Jawab internet aane par bhejein.</div>
  <div id="updates"></div>
  <main id="stage">
    <div class="card" aria-busy="true"><div class="sk" style="height:20px;width:35%"></div><div class="sk" style="height:60px"></div><div class="sk" style="height:84px"></div></div>
  </main>
</div>

<!-- recording -->
<section class="screen" id="recScreen" hidden role="dialog" aria-label="Awaaz record ho rahi hai">
  <div style="font-size:22px;font-weight:700"><span class="rec-dot"></span>Bolein, main sun raha hoon</div>
  <div class="timer" id="timer">0:00</div>
  <canvas id="wave" width="600" height="180"></canvas>
  <div class="live" id="liveText" lang="ur" hidden></div>
  <button class="stop" id="recStop" type="button">Bas, bhej dein</button>
  <button class="soft" id="recCancel" type="button" style="max-width:380px">Cancel</button>
</section>

<!-- sending / sent / failed -->
<section class="screen" id="sendScreen" hidden role="status" aria-live="polite">
  <div id="sendIcon"></div>
  <h2 id="sendTitle"></h2>
  <p id="sendBody"></p>
  <div class="quote" id="sendQuote" hidden></div>
  <button class="primary" id="sendRetry" type="button" hidden>Dobara bhejein</button>
  <button class="soft" id="sendClose" type="button" hidden>Theek hai</button>
</section>

<!-- anything else: photo / note -->
<section class="sheet" id="noteSheet" hidden role="dialog" aria-label="Photo ya koi baat bhejein">
  <div class="inner">
    <h3>Kuch aur batana hai?</h3>
    <p style="margin:0;color:var(--text-2);font-size:18px">Bill, register ka page, machine ki plate, ya koi bhi kaam ki baat.</p>
    <button class="mic" id="noteVoice" type="button"><span class="ring"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>Bol kar batayein</button>
    <label class="photo" for="photo"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="photoLabel">Photo lein</span></label>
    <img class="thumb" id="thumb" alt="Chuni hui photo" hidden>
    <input type="file" id="photo" accept="image/*">
    <textarea id="noteText" placeholder="Yahan likhein (zaroori nahi)" style="width:100%;min-height:96px;border:0;border-radius:18px;background:var(--surface-2);color:var(--text);font:inherit;font-size:20px;padding:14px"></textarea>
    <button class="primary" id="noteSend" type="button">Bhej dein</button>
    <button class="soft" id="noteClose" type="button">Wapas</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var VERSION = 'v5';
var API = 'https://script.google.com/macros/s/AKfycbxCc48LLrGKXWg4rWGb4BXZz8-Gr8bFSKHQc1-dYHJONn20Sx1w0kALFOmsbEIZSMJe/exec';
var KEY = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9]/g, '');
var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var S = { name: '', qs: [], idx: 0, done: 0, busy: false, photo: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function buzz(p){ try{ if (navigator.vibrate) navigator.vibrate(p || 12); }catch(e){} }
function toast(m, ms){ var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, ms || 3000); }
function greeting(){ var h = new Date().getHours(); return h < 12 ? 'Subah bakhair' : (h < 17 ? 'Assalam o alaikum' : 'Shaam bakhair'); }

/* ---------- talking to the Sheet: timeout + automatic retries ---------- */
function post(body, timeoutMs){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, timeoutMs || 60000);
  return fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
    .then(function(r){ clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ if (j && j.error) { var e = new Error(j.error); e.server = true; throw e; } return j; },
          function(e){ clearTimeout(timer); throw e; });
}
function postRetry(body, tries){
  tries = tries || 3;
  return post(body).catch(function(e){
    if (e.server || tries <= 1) throw e;
    return new Promise(function(res){ setTimeout(res, 2500); }).then(function(){ return postRetry(body, tries - 1); });
  });
}

/* ---------- read aloud (only if the phone has an Urdu voice) ---------- */
var URDU_VOICE = null;
function findVoice(){ try{ URDU_VOICE = speechSynthesis.getVoices().filter(function(x){ return /^ur/i.test(x.lang); })[0] || null; }catch(e){} }
if ('speechSynthesis' in window){ findVoice(); speechSynthesis.onvoiceschanged = function(){ var had = !!URDU_VOICE; findVoice(); if (!had && URDU_VOICE && S.qs.length && !S.busy) render(); }; }
function speak(t){ try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.voice = URDU_VOICE; u.lang = URDU_VOICE.lang; u.rate = .9; speechSynthesis.speak(u); }catch(e){} }

/* ---------- load ---------- */
function load(){
  $('greet').textContent = greeting();
  if (!KEY) return fatal('Ye link adhoora hai', 'Jis ne link bheja tha, un se dobara mangwa lein.');
  postRetry({ action: 'getData', key: KEY }, 3).then(start, function(){
    fatal('Connection nahi ho saka', 'Internet check karein, phir dobara koshish karein.', true);
  });
}
function start(d){
  if (!d || !d.ok) return fatal('Ye link pehchana nahi gaya', 'Jis ne link bheja tha, un se naya link mangwa lein.');
  S.name = d.name; $('name').textContent = d.name; $('moreBtn').hidden = false;
  S.qs = (d.questions || []).map(function(q){ q.status = 'open'; q.options = q.options || []; return q; });
  $('updates').innerHTML = (d.updates || []).slice(0, 1).map(function(u){
    return '<section class="learned"><small>AI ne aap se seekha</small><b>' + esc(u.title) + '</b><br>' + esc(u.body) + '</section>';
  }).join('');
  render();
}
function fatal(t, b, retry){
  $('stage').innerHTML = '<div class="card" style="text-align:center"><h2 style="margin:0;font-size:26px">' + esc(t) + '</h2><p style="margin:0;color:var(--text-2)">' + esc(b) + '</p>' +
    (retry ? '<button class="primary" type="button" onclick="location.reload()">Dobara koshish</button>' : '') + '</div>';
}

/* ---------- one question at a time ---------- */
function openList(){ return S.qs.filter(function(q){ return q.status === 'open'; }); }
var MIC_SVG = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
function render(){
  var open = openList(); if (!open.length) return renderDone();
  if (!S.qs[S.idx] || S.qs[S.idx].status !== 'open') S.idx = S.qs.indexOf(open[0]);
  var q = S.qs[S.idx], pos = open.indexOf(q) + 1;
  var opts = (q.options || []).map(function(o){ return '<button class="opt" type="button" data-a="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
             '<button class="opt muted" type="button" data-a="Pata nahi">Pata nahi</button>';
  $('stage').innerHTML =
    '<article class="card" id="card">' +
      '<div class="count">Sawal ' + pos + ' / ' + open.length + '</div>' +
      (q.urdu ? '<p class="q-urdu" lang="ur">' + esc(q.urdu) + '</p>' : '') +
      (q.roman ? '<p class="q-roman">' + esc(q.roman) + '</p>' : '') +
      (q.english ? '<p class="q-en">' + esc(q.english) + '</p>' : '') +
      (URDU_VOICE && q.urdu ? '<button class="listen" type="button" id="listen">🔊 Sawal sunein</button>' : '') +
      '<div class="said" id="said">' + (q.thread || []).map(function(t){ return '<div class="b' + (t.who === 'person' ? '' : ' bot') + '">' + esc(t.text) + '</div>'; }).join('') + '</div>' +
      '<button class="mic" id="micBtn" type="button"><span class="ring">' + MIC_SVG + '</span>Bol kar jawab dein</button>' +
      (q.options && q.options.length ? '<p class="hint">Ya ek button dabayein:</p>' : '') +
      '<div class="opts" id="opts">' + opts + '</div>' +
      '<button class="soft" id="typeBtn" type="button">⌨️ Likh kar jawab dein</button>' +
      '<div class="typebox" id="typebox" hidden><textarea id="input" placeholder="Yahan likhein…" aria-label="Jawab likhein"></textarea>' +
        '<button class="primary" id="sendText" type="button">Bhej dein</button></div>' +
      (open.length > 1 ? '<button class="skip" type="button" id="skipBtn">Abhi nahi, agla sawal →</button>' : '') +
    '</article>';
  var l = $('listen'); if (l) l.onclick = function(){ speak(q.urdu); };
  $('micBtn').onclick = function(){ VTARGET = 'answer'; startVoice(); };
  $('opts').onclick = function(e){ var b = e.target.closest('.opt'); if (b) sendAnswer(b.getAttribute('data-a'), null, null); };
  $('typeBtn').onclick = function(){ $('typeBtn').hidden = true; $('typebox').hidden = false; $('input').focus(); };
  $('sendText').onclick = function(){ var t = $('input').value.trim(); if (!t) return toast('Pehle kuch likhein'); sendAnswer(t, null, null); };
  var sk = $('skipBtn'); if (sk) sk.onclick = function(){ var o = openList(); S.idx = S.qs.indexOf(o[(o.indexOf(q) + 1) % o.length]); render(); window.scrollTo(0, 0); };
}
function renderDone(){
  $('stage').innerHTML = '<div class="card" style="text-align:center;align-items:center">' +
    '<div class="check"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44"/><path d="M29 49l13 13 25-27"/></svg></div>' +
    '<h2 style="margin:0;font-size:27px">' + (S.done ? 'Aaj ke sawal mukammal!' : 'Abhi koi naya sawal nahi') + '</h2>' +
    '<p style="margin:0;color:var(--text-2)">' + (S.done ? 'Shukriya, ' + esc(S.name) + '. ' : '') + 'Naye sawal aate hi yahan nazar aayenge.</p>' +
    '<button class="primary" type="button" onclick="openNote()">Photo ya koi baat bhejein</button>' +
    '<button class="soft" type="button" onclick="location.reload()">Naye sawal dekhein</button></div>';
}

/* ---------- sending, with a clear result every time ---------- */
var LAST = null;
function showSend(state, title, body, quote){
  $('sendScreen').hidden = false;
  $('sendIcon').innerHTML = state === 'busy' ? '<div class="spin"></div>' :
    state === 'ok' ? '<div class="check"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44"/><path d="M29 49l13 13 25-27"/></svg></div>' :
    '<div class="x"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="3"/><path d="M48 26v28M48 66v2" stroke="var(--warn)" stroke-width="7" stroke-linecap="round"/></svg></div>';
  $('sendTitle').textContent = title; $('sendBody').textContent = body || '';
  $('sendQuote').hidden = !quote; $('sendQuote').textContent = quote || '';
  $('sendRetry').hidden = state !== 'fail'; $('sendClose').hidden = state === 'busy';
  $('sendClose').textContent = state === 'fail' ? 'Baad mein' : 'Aage chalein';
}
function sendAnswer(text, audioB64, mime){
  if (S.busy) return;
  var q = S.qs[S.idx]; if (!q) return;
  S.busy = true; buzz(10);
  LAST = { kind: 'answer', q: q, body: { action: 'submitAnswer', key: KEY, qid: q.id, text: text || '', audio: audioB64 || null, mime: mime || null } };
  doSend();
}
function doSend(){
  var L = LAST, isVoice = !!L.body.audio, words = L.body.text;
  showSend('busy', 'Bheja ja raha hai…', isVoice ? 'Awaaz bheji ja rahi hai. Thoda intezar karein.' : 'Thoda intezar karein.');
  postRetry(L.body, 3).then(function(r){
    S.busy = false; buzz([12, 60, 18]);
    if (L.kind === 'answer'){
      var q = L.q; q.thread = q.thread || [];
      q.thread.push({ who: 'person', text: words || (isVoice ? '🎤 Voice note' : '') });
      if (r && r.follow_up && !r.done){ q.thread.push({ who: 'messenger', text: r.follow_up }); }
      else { q.status = 'done'; S.done++; }
      showSend('ok', 'Mil gaya! Shukriya', isVoice && !words ? 'Aap ki awaaz mehfooz ho gayi.' : (r && r.follow_up && !r.done ? 'Ek chhota sa sawal aur hai.' : ''), words ? '“' + words.slice(0, 160) + (words.length > 160 ? '…' : '') + '”' : '');
    } else {
      resetNote(); $('noteSheet').hidden = true;
      showSend('ok', 'Mil gaya! Shukriya', 'Aap ki baat mehfooz ho gayi.', words ? '“' + words.slice(0, 160) + '”' : '');
    }
    clearTimeout(doSend._t); doSend._t = setTimeout(closeSend, 3500);
  }, function(e){
    S.busy = false;
    var msg = e && e.server ? ('Masla: ' + e.message) : 'Internet kamzor hai ya band hai.';
    showSend('fail', 'Nahi gaya', msg + ' Aap ka jawab phone mein mehfooz hai, "Dobara bhejein" dabayein.');
  });
}
function closeSend(){ clearTimeout(doSend._t); $('sendScreen').hidden = true; if (!$('noteSheet').hidden) return; render(); window.scrollTo(0, 0); }
$('sendRetry').onclick = function(){ if (LAST && !S.busy){ S.busy = true; doSend(); } };
$('sendClose').onclick = function(){ if (S.busy) return; closeSend(); };

/* ---------- voice: always record (iPhone + Android); Android also writes the words live ---------- */
var VTARGET = 'answer';
var R = { rec: null, chunks: [], stream: null, ctx: null, an: null, raf: 0, t0: 0, tick: 0, cancelled: false, sr: null, srOn: false, done: [], cur: '' };
function startVoice(){
  if (S.busy) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    return micProblem('Is phone ke browser mein awaaz record nahi ho sakti.');
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(startRec, function(err){
    var n = err && err.name;
    micProblem(n === 'NotAllowedError' || n === 'SecurityError'
      ? 'Mic ki ijazat nahi mili. Upar address bar mein "aA" ya taale ka nishaan dabayein, Microphone ko "Allow" karein, phir dobara koshish karein.'
      : 'Mic nahi khula (' + (n || 'error') + ').');
  });
}
function micProblem(msg){
  showSend('fail', 'Mic nahi chala', msg + ' Abhi ke liye "Likh kar jawab dein" istemal karein.');
  $('sendRetry').hidden = true; $('sendClose').textContent = 'Theek hai';
}
function pickType(){
  var c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
  for (var i = 0; i < c.length; i++){ try{ if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return '';
}
function startRec(stream){
  R.stream = stream; R.chunks = []; R.cancelled = false;
  var type = pickType();
  try{ R.rec = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream); }
  catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); return micProblem('Recording shuru nahi hui.'); }
  R.rec.ondataavailable = function(e){ if (e.data && e.data.size) R.chunks.push(e.data); };
  R.rec.onstop = onRecStop;
  R.rec.start(1000);
  $('recScreen').hidden = false; buzz(15);
  if (!IOS) startSR();            // iPhone Safari can't record and do speech-to-text together, so iPhone just records
  R.t0 = Date.now(); $('timer').textContent = '0:00';
  R.tick = setInterval(function(){ var s = Math.floor((Date.now() - R.t0) / 1000); $('timer').textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); if (s >= 180) stopRec(false); }, 250);
  startViz(stream);
}
function stopRec(cancel){
  R.cancelled = !!cancel; clearInterval(R.tick); stopSR();
  try{ if (R.rec && R.rec.state !== 'inactive'){ R.rec.requestData && R.rec.state === 'recording' && R.rec.requestData(); R.rec.stop(); } else onRecStop(); }catch(e){ onRecStop(); }
}
function onRecStop(){
  stopViz(); try{ R.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  $('recScreen').hidden = true;
  if (R.cancelled) return;
  var secs = (Date.now() - R.t0) / 1000;
  var blob = new Blob(R.chunks, { type: (R.rec && R.rec.mimeType) || 'audio/mp4' });
  setTimeout(function(){          // give speech-to-text a moment to deliver its last words
    var words = heardText(); R.done = []; R.cur = '';
    if (blob.size < 800 && !words) return toast(secs < 1.5 ? 'Button dabaye rakhne ki zaroorat nahi: dabayein, bolein, phir "Bas, bhej dein"' : 'Awaaz sunai nahi di. Dobara bolein.', 4500);
    var fr = new FileReader();
    fr.onload = function(){
      var b64 = String(fr.result).split(',')[1] || null, mime = (blob.type || 'audio/mp4').split(';')[0];
      if (VTARGET === 'note') sendNote([$('noteText').value.trim(), words].filter(String).join('\n'), b64, mime);
      else sendAnswer(words, b64, mime);
    };
    fr.onerror = function(){ if (words) sendAnswer(words, null, null); else toast('Awaaz parhi nahi ja saki. Dobara bolein.'); };
    fr.readAsDataURL(blob);
  }, R.sr ? 600 : 0);
}
$('recStop').onclick = function(){ stopRec(false); };
$('recCancel').onclick = function(){ stopRec(true); };

function startSR(){
  R.done = []; R.cur = ''; R.srOn = false; R.sr = null; $('liveText').hidden = true; $('liveText').textContent = '';
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  try{
    var sr = new SR(); sr.lang = 'ur-PK'; sr.continuous = true; sr.interimResults = true;
    sr.onresult = function(e){ var t = ''; for (var i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
      var fin = ''; for (var j = 0; j < e.results.length; j++) if (e.results[j].isFinal) fin += e.results[j][0].transcript + ' ';
      R.cur = (fin + (e.results[e.results.length - 1].isFinal ? '' : e.results[e.results.length - 1][0].transcript)).trim(); showLive(); };
    sr.onerror = function(e){ if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'language-not-supported')) R.srOn = false; };
    sr.onend = function(){ if (R.cur){ R.done.push(R.cur); R.cur = ''; } if (R.srOn){ try{ sr.start(); }catch(e){} } };
    R.srOn = true; R.sr = sr; sr.start();
  }catch(e){ R.sr = null; R.srOn = false; }
}
function stopSR(){ R.srOn = false; try{ if (R.sr) R.sr.stop(); }catch(e){} }
function heardText(){ return (R.done || []).concat(R.cur ? [R.cur] : []).join(' ').replace(/\s+/g, ' ').trim(); }
function showLive(){ var t = heardText(), el = $('liveText'); if (t){ el.hidden = false; el.textContent = t; el.scrollTop = el.scrollHeight; } }

function startViz(stream){
  var cv = $('wave'), g = cv.getContext('2d'), bars = [];
  try{ var AC = window.AudioContext || window.webkitAudioContext; R.ctx = new AC(); R.an = R.ctx.createAnalyser(); R.an.fftSize = 512; R.ctx.createMediaStreamSource(stream).connect(R.an); }catch(e){ R.an = null; }
  var buf = R.an ? new Uint8Array(R.an.fftSize) : null, col = getComputedStyle(document.documentElement).getPropertyValue('--rec').trim() || '#d93a40';
  (function f(){
    var lvl = .08; if (R.an){ R.an.getByteTimeDomainData(buf); var s = 0; for (var i = 0; i < buf.length; i++){ var v = (buf[i] - 128) / 128; s += v * v; } lvl = Math.min(1, Math.sqrt(s / buf.length) * 4.5 + .04); }
    bars.push(lvl); var n = Math.floor(cv.width / 14); if (bars.length > n) bars.shift();
    g.clearRect(0, 0, cv.width, cv.height); g.fillStyle = col;
    for (var j = 0; j < bars.length; j++){ var h = Math.max(8, bars[j] * cv.height * .9); g.fillRect(cv.width - (bars.length - j) * 14 + 3, (cv.height - h) / 2, 8, h); }
    R.raf = requestAnimationFrame(f);
  })();
}
function stopViz(){ cancelAnimationFrame(R.raf); try{ if (R.ctx) R.ctx.close(); }catch(e){} }

/* ---------- photo / anything else ---------- */
function openNote(){ $('noteSheet').hidden = false; window.scrollTo(0, 0); }
$('moreBtn').onclick = openNote;
$('noteClose').onclick = function(){ $('noteSheet').hidden = true; };
$('noteVoice').onclick = function(){ VTARGET = 'note'; startVoice(); };
function resetNote(){ $('noteText').value = ''; S.photo = null; $('thumb').hidden = true; $('photo').value = ''; $('photoLabel').textContent = 'Photo lein'; }
$('photo').onchange = function(e){
  var f = e.target.files[0]; if (!f) return; var rd = new FileReader();
  rd.onload = function(){ var img = new Image(); img.onload = function(){ var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var url = c.toDataURL('image/jpeg', .82); S.photo = url.split(',')[1]; $('thumb').src = url; $('thumb').hidden = false; $('photoLabel').textContent = 'Photo badlein'; }; img.src = rd.result; };
  rd.readAsDataURL(f);
};
$('noteSend').onclick = function(){ var t = $('noteText').value.trim(); if (!t && !S.photo) return toast('Kuch likhein, photo lein, ya bol kar batayein'); sendNote(t, null, null); };
function sendNote(text, audioB64, mime){
  if (S.busy) return; S.busy = true;
  LAST = { kind: 'note', body: { action: 'submitFree', key: KEY, text: text || '', photo: S.photo, audio: audioB64 || null, mime: mime || null } };
  doSend();
}

function net(){ $('offline').hidden = navigator.onLine; }
window.addEventListener('online', net); window.addEventListener('offline', net); net();
load();
</script>
